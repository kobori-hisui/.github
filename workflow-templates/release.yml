name: Release

# Runs when a version tag is pushed, for example: git tag -a v0.3.2 -m "v0.3.2" && git push origin v0.3.2
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Adjust to your project. For WXT extensions this is usually the zip script.
      - run: pnpm run --if-present build
      - run: pnpm run --if-present zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(.output/*.zip)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
